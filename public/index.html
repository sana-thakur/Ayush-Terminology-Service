<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FHDR | Terminology Service</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-header">
    <a href="/" class="logo">FHDR <span>Terminology</span></a>
    <nav class="nav-links">
      <a href="/" class="active">Search UI</a>
      <a href="/api-playground.html">API Playground</a>
    </nav>
  </header>

  <main>
    <div class="main-layout">
      <!-- Search Panel -->
      <div class="panel">
        <div class="panel-header">
          <svg class="panel-header-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
          <h2 class="panel-title">Search NAMASTE Terminology</h2>
        </div>
        
        <div class="search-bar">
          <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
          <input type="text" id="searchInput" class="search-input" placeholder="Search by term or code (e.g., Migraine, A-2)...">
        </div>

        <ul class="results-list" id="resultsList">
            <!-- JS will populate this -->
        </ul>

        <div class="pagination-controls">
          <button id="prevButton" class="btn btn-secondary" disabled>Previous</button>
          <span class="page-info" id="pageInfo">Page 0 of 0</span>
          <button id="nextButton" class="btn btn-secondary" disabled>Next</button>
        </div>
      </div>

      <!-- Problem List Panel -->
      <div class="panel">
        <div class="panel-header">
            <svg class="panel-header-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" /></svg>
            <h2 class="panel-title">Patient Problem List</h2>
        </div>

        <div class="problem-list-container" id="problemList">
            <!-- JS will populate this -->
            <div class="empty-state">
                <svg class="empty-state-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m-9 1V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z" /></svg>
                <h3>Problem List is Empty</h3>
                <p>Add terms from the search results to see them here.</p>
            </div>
        </div>
        
        <div class="fhir-bundle-container">
            <div class="fhir-bundle-header">
                <h3 class="panel-title" style="font-size: 1.1rem;">Generated FHIR Bundle</h3>
                <button id="uploadButton" class="btn btn-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/><path d="M7.646 1.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 2.707V11.5a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708l3-3z"/></svg>
                    <span>Create & Upload Bundle</span>
                </button>
            </div>
            <pre id="fhirBundleOutput">{ "message": "FHIR Bundle will be shown here." }</pre>
        </div>
      </div>
    </div>
  </main>

  <script src="js/scripts.js" defer></script>
</body>
</html>
